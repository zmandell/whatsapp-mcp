name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: whatsapp-bridge/go.mod
          cache-dependency-path: whatsapp-bridge/go.sum

      - name: Go format, vet and test
        working-directory: whatsapp-bridge
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax and tests
        run: |
          python -m compileall -q whatsapp-mcp-server/*.py
          pip install requests
          python -m unittest discover -s whatsapp-mcp-server -p "test_*.py"

      - name: Build the deploy image
        run: docker build -f render/Dockerfile -t mcp-hub:ci .

  deploy:
    needs: check
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Ask Render to deploy this commit
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          test -n "$HOOK" || { echo "RENDER_DEPLOY_HOOK is not set"; exit 1; }
          case "$HOOK" in *\?*) sep='&' ;; *) sep='?' ;; esac
          curl -fsS -X POST "${HOOK}${sep}ref=${GITHUB_SHA}"
          echo
          echo "Deploy requested for ${GITHUB_SHA}"
