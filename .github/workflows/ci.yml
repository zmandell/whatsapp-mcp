name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: whatsapp-bridge/go.mod
          cache-dependency-path: whatsapp-bridge/go.sum

      - name: Go format, vet and test
        working-directory: whatsapp-bridge
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax
        run: python -m compileall -q whatsapp-mcp-server/*.py

      - name: Build the deploy image
        run: docker build -f render/Dockerfile -t mcp-hub:ci .
